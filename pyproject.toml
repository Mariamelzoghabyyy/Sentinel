[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-soc"
version = "0.1.0"
description = "Agentic web-log triage: LangGraph pipeline that flags bot-like patterns and writes SOC-style reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0"]

[project.scripts]
sentinel = "sentinel.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
